# CI/CD pipeline with security checks.
#
#   test ──────┐
#   gitleaks ──┤
#   hadolint ──┼──► build image ──► Syft (SBOM) ──► Trivy (vulnerabilities) ──► push (main only)
#   bandit ────┘
#                         all of the above ──► pr-summary (one comment on the PR)
#
# Every scan job follows the same pattern, so a report exists even when the scan fails:
#   1. run the scanner, JSON output, `continue-on-error` so the job keeps going
#   2. write the findings to the job summary + upload the JSON as an artifact
#   3. fail the job if step 1 failed
# The Markdown is produced by .github/scripts/ci_report.py.
#
# Every action is pinned to a full commit SHA (the comment shows the version).
# A tag like @v4 can be moved by whoever controls the repository; a SHA cannot.
# Dependabot (github-actions ecosystem) keeps these SHAs up to date for you.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default: read-only token. Jobs that need more ask for it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  # ---------------------------------------------------------------- secrets
  # Runs the open-source Gitleaks CLI (MIT license) directly.
  # (The official gitleaks-action is not open source since v2.)
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: scan every commit, not just the last one

      - name: Install Gitleaks (download + verify checksum)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $file" | sha256sum --check
          tar -xzf "$file" gitleaks

      - name: Scan git history for secrets
        id: scan
        continue-on-error: true
        # --redact keeps the secret values out of the log and the report.
        run: ./gitleaks git --redact --verbose --report-format json --report-path gitleaks.json .

      - name: Write report
        run: python3 .github/scripts/ci_report.py section gitleaks gitleaks.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-gitleaks
          path: gitleaks.json
          retention-days: 7

      - name: Fail if secrets were found
        if: steps.scan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------- Dockerfile lint
  # Hadolint checks the Dockerfile against best practices
  # (pinned versions, no root user, clean apt caches, ...).
  hadolint:
    runs-on: ubuntu-latest
    env:
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hadolint (download + verify checksum)
        run: |
          curl -sSfL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check
          chmod +x hadolint

      # Fails on warnings and errors; info/style findings are reported but don't fail.
      - name: Lint Dockerfile
        id: scan
        continue-on-error: true
        run: ./hadolint --failure-threshold warning --format json Dockerfile > hadolint.json

      - name: Write report
        run: python3 .github/scripts/ci_report.py section hadolint hadolint.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-hadolint
          path: hadolint.json
          retention-days: 7

      - name: Fail if the Dockerfile has warnings or errors
        if: steps.scan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------- Python SAST
  # Bandit scans the Python source for common security issues
  # (eval, shell=True, hardcoded passwords, debug=True, weak crypto, ...).
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4

      # Only MEDIUM and HIGH severity findings are reported, and they fail the job.
      - name: Scan app code with Bandit
        id: scan
        continue-on-error: true
        run: bandit -r app --severity-level medium --format json --output bandit.json

      - name: Write report
        run: python3 .github/scripts/ci_report.py section bandit bandit.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-bandit
          path: bandit.json
          retention-days: 7

      - name: Fail if Bandit found issues
        if: steps.scan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------- image
  build-scan-push:
    needs: [test, gitleaks, hadolint, bandit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1. Build the image locally on the runner. Nothing is published yet.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # 2. Syft: list every package inside the image (SBOM).
      #    Downloadable from the run page, under "Artifacts".
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          syft-version: v1.57.1
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-release-assets: false

      # 3. Trivy: fail if the image has HIGH or CRITICAL vulnerabilities
      #    that already have a fix available.
      - name: Scan image with Trivy
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy.json

      - name: Write report
        run: |
          python3 .github/scripts/ci_report.py section sbom sbom.spdx.json >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/ci_report.py section trivy trivy.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-image
          path: |
            trivy.json
            sbom.spdx.json
          retention-days: 7

      - name: Fail if Trivy found vulnerabilities
        if: steps.scan.outcome == 'failure'
        run: exit 1

      # 4. Publish, only on main and only if every check above passed.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"

  # ---------------------------------------------------------------- PR comment
  # Collects every report and posts ONE comment on the PR.
  # On the next push the same comment is edited, not duplicated.
  pr-summary:
    needs: [test, gitleaks, hadolint, bandit, build-scan-push]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - name: Build comment
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/ci_report.py comment reports > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # PRs from forks get a read-only token and can't comment:
      # for those, the summary is only on the workflow run page.
      - name: Post or update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ci-security-summary -->"))) | .id' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "Updated comment $id"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
            echo "Created comment"
          fi
